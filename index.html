<!doctype html>
<html lang="en-AU" class="s1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAFE computer log in practice</title>
<style>
:root{
--or:#F5A20F;--or-d:#B97700;--or-t:#FFF1D6;--ink:#141414;--ink2:#2b2b2b;--bg:#FFF9EF;--card:#fff;--line:#E6DCCB;--grey:#555;
--good:#1c7a3e;--good-t:#E7F4EC;--bad:#b3261e;--bad-t:#FBECEB;--info:#1a5fb4;--info-t:#E8F0FB;
--A:#2F6FDF;--A-t:#E6EEFC;--B:#1E9E5A;--B-t:#E4F5EC;--C:#8A4FD8;--C-t:#F1E9FC;
--disp:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
--body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
--mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
--part:var(--A);--part-t:var(--A-t);
}
html{font-size:28px;-webkit-text-size-adjust:100%;scroll-padding-top:150px;scroll-padding-bottom:140px}
html.s0{font-size:24px}html.s1{font-size:28px}html.s2{font-size:34px}html.s3{font-size:40px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.35;overflow-x:hidden;overflow-wrap:normal;word-break:normal;hyphens:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:900;line-height:1.15;margin:0}
code{font-family:var(--mono);background:#fff;border:2px solid var(--ink);border-radius:6px;padding:0 .25em;font-size:.9em;white-space:nowrap}

/* top */
#head{position:sticky;top:0;z-index:50}
#task{position:sticky;z-index:45}
#task.free{position:static}
.top{display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:6px 8px}
.dots{display:flex;gap:5px;flex:none}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots i+i{background:var(--or)}.dots i+i+i{background:#28c840}
.addr{flex:1;min-width:0;background:#2b2b2b;border-radius:999px;padding:4px 14px;font-family:var(--mono);font-size:min(.62rem,18px);color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr b{color:var(--or)}
.tbsp{flex:1;display:none}
.tbb{flex:none;background:#2b2b2b;color:#fff;border-radius:10px;min-width:48px;min-height:48px;padding:4px 10px;font-size:min(.8rem,5.4vw);font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.tbb:hover{background:#3a3a3a}.tbb svg{width:1em;height:1em}
.tbb.hide{display:none}
@media (max-width:620px){.addr{display:none}.tbsp{display:block}.dots{display:none}.tbb{padding:4px 8px;min-width:44px;min-height:44px}.mtxt{display:none}}
.prog{display:flex;gap:5px;background:var(--ink);padding:0 8px 7px}
.seg{flex:1;height:10px;background:#3a3a3a;border-radius:6px;overflow:hidden}.seg i{display:block;height:100%;width:0;transition:width .4s}
#saved{position:fixed;right:10px;top:70px;z-index:60;background:var(--good);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:min(.7rem,18px);opacity:0;transition:opacity .3s;pointer-events:none}
#saved.show{opacity:1}

/* task box */
.task{background:#fff;border:3px solid var(--ink);border-left:14px solid var(--part);border-radius:14px;padding:.35em .6em .45em;margin:6px 8px 4px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:min(.9rem,5.6vw);max-width:980px}
@media (min-width:1000px){.task{margin:6px auto 4px}}
.trow{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.tlb{background:var(--part);color:#fff;font-family:var(--disp);font-weight:900;border-radius:8px;padding:0 .4em;line-height:1.5}
.tstep{font-weight:700;color:var(--grey)}
.ttext{font-weight:700;margin-top:.15em}
.tnote{display:block;font-weight:400;color:var(--grey);font-size:.88em;margin-top:.1em}
.thint{display:block;font-weight:400;background:var(--or-t);border-radius:8px;padding:.2em .4em;margin-top:.25em}
.thint .tnote{display:inline}
.pcard{display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:center;background:var(--or-t);border:2px dashed var(--or-d);border-radius:10px;padding:.2em .5em;margin-top:.3em;font-size:.92em}
.pcard b{font-family:var(--disp);font-weight:900;font-size:.8em;letter-spacing:.02em}
.tfb{margin-top:.3em;border-radius:10px;padding:.2em .5em;font-weight:700}
.tfb.bad{background:var(--bad-t);color:var(--bad);border:2px solid var(--bad)}
.tfb.good{background:var(--good-t);color:var(--good);border:2px solid var(--good)}
.tfb.info{background:var(--info-t);color:var(--info);border:2px solid var(--info)}
.tbtns{display:flex;flex-wrap:wrap;gap:.35em;margin-top:.35em}
.sbtn,.pbtn,.ghost{border-radius:12px;padding:.2em .7em;min-height:48px;font-weight:700}
.sbtn{background:var(--or);color:var(--ink);border:3px solid var(--ink)}
.pbtn{background:var(--good);color:#fff;border:3px solid var(--good)}
.ghost{background:#fff;border:3px solid var(--ink)}
.ghost.warn{background:var(--bad-t);border-color:var(--bad);color:var(--bad)}
.task.flash,.card.flash{animation:fl 1s 2}
@keyframes fl{50%{box-shadow:0 0 0 8px var(--or)}}
.task.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

main{max-width:980px;margin:0 auto;padding:10px 8px 120px}

/* bottom bar */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:3px solid var(--ink);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tip{flex:1 1 9em;color:var(--grey);font-size:min(.75rem,4.6vw)}
.bbtns{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.bb{border-radius:12px;padding:.15em .7em;min-height:52px;font-weight:700;font-size:min(.85rem,5.2vw);border:3px solid var(--ink);background:#fff;white-space:nowrap}
@media (max-width:700px){#bar{gap:4px}.tip{flex:1 1 100%;font-size:min(.7rem,4.2vw)}.bbtns{width:100%;margin-left:0}.bb{flex:1 1 auto;white-space:normal;line-height:1.15;padding:.15em .4em}}
.bb.go{background:var(--good);border-color:var(--good);color:#fff}
.bb.wait{background:var(--or);color:var(--ink)}
.bb.skip{background:#eee;border-color:#888;color:#333}
#pill{position:fixed;left:50%;transform:translateX(-50%);z-index:55;display:none;max-width:92vw}
#pill button{background:var(--ink);color:#fff;border-radius:999px;padding:.2em .9em;min-height:48px;font-weight:700;font-size:min(.75rem,4.6vw);box-shadow:0 4px 12px rgba(0,0,0,.3)}
#pill button b{color:var(--or)}

/* menu */
.hero{display:grid;grid-template-columns:1fr;gap:12px;margin:6px 0 14px}
@media (min-width:760px){.hero{grid-template-columns:1.6fr 1fr}}
.hpan{background:var(--or);border:4px solid var(--ink);border-radius:20px;padding:.6em .8em;box-shadow:0 6px 0 var(--ink)}
.eyebrow{font-weight:700;font-size:.72em;letter-spacing:.02em}
.hpan h1{font-size:min(1.6rem,8.6vw);margin:.15em 0}
.sub{margin:0;font-size:.95em}
.hside{display:none;background:var(--ink);border-radius:20px;padding:14px;align-items:center;justify-content:center}
@media (min-width:760px){.hside{display:flex}}
.hside svg{width:100%;max-width:300px;height:auto}
.wb{background:var(--good-t);border:3px solid var(--good);border-radius:14px;padding:.4em .6em;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.wb button{background:var(--good);color:#fff;border-radius:10px;padding:.1em .7em;min-height:48px;font-weight:700}
.warnbox{background:var(--bad-t);border:3px solid var(--bad);color:var(--bad);border-radius:14px;padding:.4em .6em;margin:0 0 12px;font-weight:700}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.55em .7em;margin:0 0 14px;box-shadow:0 4px 0 rgba(0,0,0,.12);border-left-width:12px}
.card.ok{border-left-color:var(--good)}.card.no{border-left-color:var(--bad)}
.card h2{font-size:min(1rem,6vw);margin-bottom:.3em}
.blist{list-style:none;margin:0;padding:0}
.blist li>span:last-child{min-width:0}.blist code{font-size:min(.9em,5.4vw);white-space:normal;word-break:break-all}.blist li{display:flex;gap:.45em;align-items:flex-start;padding:.25em 0;border-top:2px dashed var(--line)}
.blist li:first-child{border-top:0}
.bi{flex:none;font-size:1.1em;line-height:1.2}
.ghead{font-family:var(--disp);font-weight:900;font-size:.8em;color:var(--grey);margin:14px 2px 6px;text-transform:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11em),1fr));gap:12px}
.tile{display:flex;gap:.5em;align-items:stretch;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:.45em .55em;box-shadow:0 5px 0 var(--tc);width:100%}
.tile:hover{transform:translateY(-2px)}
.tile .lb{flex:none;width:1.7em;border-radius:10px;background:var(--tc);color:#fff;font-family:var(--disp);font-weight:900;font-size:1.1em;display:flex;align-items:center;justify-content:center}
.tile>span:last-child{flex:1;min-width:0}.tile .tt{font-family:var(--disp);font-weight:900;font-size:min(.95em,6.4vw);line-height:1.15;display:block}
.tile .td{font-size:.82em;color:var(--grey);margin-top:.1em}
.tile .ts{display:inline-block;margin-top:.25em;border-radius:999px;padding:0 .5em;font-size:.78em;font-weight:700;background:var(--or-t);border:2px solid var(--or-d)}
.tile .ts.done{background:var(--good-t);border-color:var(--good);color:var(--good)}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10em),1fr));gap:.3em .8em}
.words div{padding:.15em 0;border-bottom:2px dashed var(--line)}
.words b{color:var(--or-d)}
.again{background:var(--or-t);border:3px solid var(--or-d);border-radius:16px;padding:.5em .7em;margin:14px 0}
.again h3{font-size:.9em;margin-bottom:.25em}
.tset{margin-top:14px}
.tset .row{display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:.3em 0;border-top:2px dashed var(--line);flex-wrap:wrap}
.sw{min-width:4.2em;min-height:48px;border-radius:999px;border:3px solid var(--ink);font-weight:700;background:#ddd}
.sw.on{background:var(--good);color:#fff;border-color:var(--good)}
.small{font-size:.8em;color:var(--grey)}

/* part header */
.rhead{display:flex;gap:.5em;align-items:stretch;background:var(--ink);color:#fff;border-radius:16px;padding:.45em .6em;margin:4px 0 12px}
.rhead .lb{flex:none;width:1.7em;border-radius:10px;background:var(--part);color:#fff;font-family:var(--disp);font-weight:900;font-size:1.1em;display:flex;align-items:center;justify-content:center}
.rht{flex:1;min-width:0}
.rhead h2{font-size:min(1rem,6vw)}
.rdesc{font-size:.85em;color:#ddd}
.live{display:inline-block;background:#fff;color:var(--ink);border-radius:999px;padding:0 .5em;font-size:.78em;font-weight:700;margin-top:.25em}
.pbar{height:10px;background:#444;border-radius:6px;margin-top:.3em;overflow:hidden}.pbar i{display:block;height:100%;background:var(--part)}

/* monitor */
.mon{background:#1d1d1d;border-radius:18px;padding:10px 10px 14px;box-shadow:0 6px 0 #000}
.stand{width:26%;height:18px;background:#2a2a2a;margin:0 auto;border-radius:0 0 10px 10px}
.foot2{width:40%;height:8px;background:#2a2a2a;margin:0 auto 12px;border-radius:6px}
.scr{position:relative;height:max(clamp(400px,58vh,620px),23.5em);border-radius:8px;overflow:hidden;font-size:min(.74rem,4.7vw,24px);color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;line-height:1.25}
.sc{position:absolute;inset:0;cursor:pointer}
.black{background:#050505;display:flex;align-items:center;justify-content:center}
.led{position:absolute;right:14px;bottom:10px;width:10px;height:10px;border-radius:50%;background:var(--or);animation:led 2s infinite}
@keyframes led{50%{opacity:.25}}
.zzz{color:#333;font-family:var(--disp);font-weight:900;font-size:1.6em;letter-spacing:.3em}
.wall{background:linear-gradient(135deg,#0b3d6e 0%,#1b6fa8 45%,#5fb3d9 100%)}
.lock{display:flex;flex-direction:column;align-items:center;padding-top:12%}
.ltime{font-size:3.4em;font-weight:300;line-height:1}
.ldate{font-size:1.15em;margin-top:.2em}
.lmsg{position:absolute;left:5%;right:5%;bottom:9%;text-align:center;font-weight:700;font-size:1.1em;background:rgba(0,0,0,.35);border-radius:10px;padding:.35em .5em}
.notice{background:#0a2f57;display:flex;align-items:center;justify-content:center;padding:1em}
.nbox{background:#fff;color:#111;border-radius:10px;padding:.8em 1em;max-width:22em;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.nbox .nh{font-weight:700;font-size:1.25em;margin-bottom:.3em}
.nbox p{margin:.25em 0}
.nok{display:block;margin:.6em 0 0 auto;background:#0f6cbd;color:#fff;border-radius:6px;padding:.3em 1.6em;font-weight:700;min-height:2.2em}
.signin{background:linear-gradient(160deg,#08233f,#14548a 60%,#2c7fb8)}
.sic{position:absolute;left:0;right:0;top:0;bottom:5.6em;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .8em}
.avatar{width:5em;height:5em;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.avatar svg{width:62%;height:62%}
.siname{font-size:1.45em;margin:.3em 0 .4em}
.fld{width:min(15em,92%);background:rgba(255,255,255,.95);color:#111;border:2px solid #9aa;border-radius:6px;padding:0 .4em;margin:.3em 0;display:flex;align-items:center;min-height:2.2em;position:relative}
.fld.on{border-color:#4CC2FF;box-shadow:0 0 0 3px rgba(76,194,255,.55)}
.fld.dim{opacity:.85}
.fld .ph{color:#666}
.fld .val{font-family:var(--mono);letter-spacing:.03em;white-space:pre}
.fv{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden}
.caret{display:inline-block;width:2px;height:1.2em;background:#111;margin-left:1px;animation:car 1s steps(1) infinite}
@keyframes car{50%{opacity:0}}
.eye,.siarrow{flex:none;display:flex;align-items:center;justify-content:center;width:2em;height:1.8em;border-radius:4px}
.eye svg{width:1.2em;height:1.2em}
.siarrow{background:#0f6cbd;color:#fff;font-weight:700;margin-left:.2em}
.capsw{background:#fff3cd;color:#6b4e00;border-radius:6px;padding:.1em .5em;font-weight:700;margin-top:.2em}
.errmsg{background:rgba(0,0,0,.35);border-radius:8px;padding:.4em .6em;text-align:center;max-width:16em;margin:.4em 0;font-weight:700}
.silist{position:absolute;left:.5em;bottom:.5em;display:flex;flex-direction:column;gap:.25em}
.tile2{display:flex;align-items:center;gap:.35em;padding:.2em .5em .2em .25em;border-radius:6px;min-height:2.2em;background:rgba(255,255,255,.08)}
.tile2.act{background:rgba(255,255,255,.28)}
.tav{width:1.6em;height:1.6em;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}.tav svg{width:70%;height:70%}
.sicons{position:absolute;right:.5em;bottom:.5em;display:flex;gap:.3em}
.sico{width:2.3em;height:2.3em;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08)}
.sico svg{width:1.3em;height:1.3em}
.spin{display:flex;gap:.35em;margin:.6em 0}
.spin i{width:.45em;height:.45em;border-radius:50%;background:#fff;animation:sp 1.2s infinite}
.spin i:nth-child(2){animation-delay:.15s}.spin i:nth-child(3){animation-delay:.3s}.spin i:nth-child(4){animation-delay:.45s}.spin i:nth-child(5){animation-delay:.6s}
@keyframes sp{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-.3em)}}
.wel{font-size:1.6em}
.desk{background:linear-gradient(135deg,#1f4f8a 0%,#3e8dc7 55%,#9fd3ea 100%)}
.dicons{position:absolute;left:.3em;top:.3em;display:flex;flex-direction:column;gap:.15em}
.dki{width:4.6em;display:flex;flex-direction:column;align-items:center;padding:.2em;border-radius:6px;text-align:center;border:2px solid transparent}
.dki svg{width:2.2em;height:2.2em}
.dki span{font-size:.78em;text-shadow:0 1px 3px #000;margin-top:.1em;line-height:1.1}
.dki.sel{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.7)}
.taskbar{position:absolute;left:0;right:0;bottom:0;background:rgba(18,22,32,.9);display:flex;justify-content:center;align-items:stretch;gap:.1em;padding:.15em .3em}
.tbi{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.1em .3em;border-radius:6px;min-width:2.8em;position:relative}
.tbi svg{width:1.6em;height:1.6em}
.tbi span{font-size:max(.62em,10px);margin-top:.05em;line-height:1}
.tbi.open::after{content:"";position:absolute;bottom:0;left:30%;right:30%;height:3px;border-radius:2px;background:#4CC2FF}
.clock{position:absolute;right:.4em;top:0;bottom:0;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;font-size:.72em;line-height:1.2}
@media (max-width:560px){.clock{display:none}}
.bwin{position:absolute;left:3%;right:3%;top:3%;bottom:3.4em;background:#f7f7f7;color:#111;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column}
.btabs{display:flex;align-items:center;gap:.4em;background:#dfe3e8;padding:.25em .4em 0}
.btab{background:#f7f7f7;border-radius:8px 8px 0 0;padding:.25em .6em;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.bctl{margin-left:auto;display:flex;gap:.2em}
.bctl span{width:1.8em;height:1.6em;display:flex;align-items:center;justify-content:center;border-radius:4px}
.mn{display:block;width:.8em;height:2px;background:#333}
.mx{display:block;width:.7em;height:.7em;border:2px solid #333}
.baddr{display:flex;align-items:center;gap:.4em;padding:.3em .4em;border-bottom:1px solid #ccc;font-size:.95em}
.burl{flex:1;background:#fff;border:1px solid #bbb;border-radius:999px;padding:.2em .7em;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;padding:.5em}
.bsearch{width:min(16em,90%);border:2px solid #bbb;border-radius:999px;padding:.35em .8em;color:#666;background:#fff}
.bname{font-family:var(--disp);font-weight:900;font-size:1.3em;color:#444}
.smenu{position:absolute;left:50%;transform:translateX(-50%);bottom:3.4em;width:min(19em,94%);background:#f3f3f3;color:#111;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:.6em .6em 0;overflow:visible}
.smsearch{background:#fff;border:1px solid #bbb;border-radius:999px;padding:.25em .7em;color:#666}
.smh{font-weight:700;margin:.5em 0 .3em}
.smgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em}
.smapp{display:flex;flex-direction:column;align-items:center;padding:.25em;border-radius:6px;font-size:.85em;text-align:center}
.smapp svg{width:1.7em;height:1.7em}
.smfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ccc;margin:.5em -.6em 0;padding:.35em .6em;background:#e9e9e9;border-radius:0 0 10px 10px;position:relative}
.smuser{display:flex;align-items:center;gap:.35em;padding:.2em .4em;border-radius:6px;font-weight:700}
.smuser .tav{background:#8aa}
.smpwr{width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center;border-radius:6px}
.smpwr svg{width:1.2em;height:1.2em}
.upop{position:absolute;left:.4em;bottom:100%;margin-bottom:.3em;background:#fff;border:1px solid #bbb;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.3);min-width:12em;overflow:hidden}
.upop div{padding:.4em .8em;border-top:1px solid #eee}
.upop div:first-child{border-top:0}
.dark .tbi svg path,.x{}
.glow{outline:4px solid var(--or)!important;outline-offset:2px;animation:gl 1s infinite;border-radius:6px}
@keyframes gl{50%{outline-color:#fff}}

   if(hit==='passbox')return;

  case 'browser':
   if(hit==='tb-edge'||hit==='tb-chrome'){openBrowser(hit);return;}
   if(hit==='dk-edge'||hit==='dk-chrome'){dblTap(hit);return;}
   wrong(msgFor(hit,id));return;
  case 'browserDone':info('The browser is open. Tap Next in the box at the top.');return;

  case 'u2Box':if(hit==='u2box'){st.focus='u2';advance();}else wrong(msgFor(hit,id));return;

   wrong(msgFor(hit,id));return;
  case 'p2Box':if(hit==='p2box'){st.focus='p2';st.err2='';advance();}else if(hit==='forgot')info('Use this link if you forget your password. Today, look at your practice card.');else wrong(msgFor(hit,id));return;

   if(hit==='p2box')return;
   if(hit==='u2box'){info('Your email address is right. Now type your password.');return;}
   if(hit==='forgot'){info('Use this link if you forget your password. Today, look at your practice card.');return;}
   wrong(msgFor(hit,id));return;

   if(hit==='approve')advance();
   else if(hit==='mfa-code')info('A code from the phone app is another way. Today, tap Approve on the phone.');
   else wrong(msgFor(hit,id));
   return;

  case 'outlook':if(hit==='app-outlook')advance();else wrong(msgFor(hit,id));return;
  case 'inboxDone':info('This is your inbox. Tap Next in the box at the top.');return;

  case 'emailOut':if(hit==='em-signout')advance();else wrong(msgFor(hit,id));return;

   wrong(msgFor(hit,id));return;
 }

function screenKey(k){
 var st=cur(),id=curStep();
 if(st.done)return;
 if(id==='cad'){
  if(k==='c-ctrl'){st.held.ctrl=!st.held.ctrl;render();return;}
  if(k==='c-alt'){st.held.alt=!st.held.alt;render();return;}
  if(k==='c-del'){if(st.held.ctrl&&st.held.alt){advance();}else wrong('Tap Ctrl and Alt first. Then tap Delete.');return;}
  var nm=k.indexOf('c-o:')===0?k.slice(4):'';wrong((nm?'This is the '+nm+' key. ':'This is not the right key. ')+'You need Ctrl, Alt and Delete.');return;
 }
 if(id==='passType'&&st.err){info('Read the message on the screen. Tap OK.');return;}
 var f=TYPE[id];
 if(f){
  if(k==='bksp'){st[f]=st[f].slice(0,-1);afterType();return;}
  if(k==='shift'){st.shift=!st.shift;render();return;}
  if(k==='caps'){st.caps=!st.caps;render();return;}
  if(k==='enter'){pressEnter();return;}
  if(k==='space'){addChar(' ');return;}
  var c=k;if(/^[a-z]$/.test(c)&&st.shift!==st.caps)c=c.toUpperCase();st.shift=false;addChar(c);return;
 }
 var M={other:'First choose the account. Tap Other user.',userBox:'First tap the User name box.',passBox:'First tap the Password box.',addrBox:'First tap the address bar.',emailBox:'First tap the Email address box.',u2Box:'First tap the Username box.',p2Box:'First tap the Password box.'};
 info(M[id]||'Use the screen for this step.');
}
function physKey(e){
 var st=cur(),id=curStep(),f=TYPE[id];
 if(!f)return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.getModifierState)st.caps=e.getModifierState('CapsLock');

 if(e.key==='Backspace'){e.preventDefault();st[f]=st[f].slice(0,-1);afterType();}
 else if(e.key==='Enter'){e.preventDefault();pressEnter();}
 else if(e.key.length===1){e.preventDefault();addChar(e.key);}
}

  var act=a.getAttribute('data-act');
  switch(act){
   case 'smaller':if(S.size>0){S.size--;save(true);render();}flashSaved('Text: '+SIZE_NAMES[S.size]);return;
   case 'bigger':if(S.size<3){S.size++;save(true);render();}flashSaved('Text: '+SIZE_NAMES[S.size]);return;
   case 'fs':var d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else{var el=d.documentElement;var f=el.requestFullscreen||el.webkitRequestFullscreen;if(f){try{var pr=f.call(el);if(pr&&pr.catch)pr.catch(function(){});}catch(err){}}}return;
   case 'menu':go('menu');return;
   case 'go':go(a.getAttribute('data-v'));return;
   case 'startnext':startNext();return;
   case 'nextpart':nextPart();return;
   case 'blocked':blocked++;if(isSim())flashEl('taskbox');else{var fu=firstUnanswered();if(fu)flashEl(fu);}renderBar();layout();return;
   case 'pillgo':var fu2=firstUnanswered();if(fu2)flashEl(fu2);return;
   case 'showme':var st=cur();st.glow=true;render();var gl=document.querySelector('.glow');if(gl)gl.scrollIntoView({behavior:'smooth',block:'center'});return;
   case 'nextstep':advance();return;
   case 'confirm':doConfirm(a.getAttribute('data-what'));return;
   case 'teacher':S.teacher=!S.teacher;save(true);render();return;
   case 'set':var k=a.getAttribute('data-k');S.settings[k]=!S.settings[k];S.sim.A=freshSim();S.sim.B=freshSim();S.quiz.ords={};save();render();return;
   case 'pick':var qid=a.getAttribute('data-q');S.quiz.pick[qid]=+a.getAttribute('data-o');save();render();return;
   case 'chg':delete S.quiz.pick[a.getAttribute('data-q')];save();render();return;
   case 'ordtap':var o=S.quiz.ords[a.getAttribute('data-s')];o.built.push(+a.getAttribute('data-i'));if(o.built.length===o.seq.length)o.checked=true;save();render();return;
   case 'ordundo':S.quiz.ords[a.getAttribute('data-s')].built.pop();save();render();return;
   case 'ordreset':var sid=a.getAttribute('data-s'),ol=S.quiz.ords[sid].seq.length;S.quiz.ords[sid]={seq:orderSeq(ol),built:[],checked:false};save();render();return;
   case 'jump':flashEl(a.getAttribute('data-to'));return;
   case 'jumpC':var to=a.getAttribute('data-to');go('C');setTimeout(function(){flashEl(to);},60);return;
  }
  return;
 }
 if(!isSim())return;
 var k2=e.target.closest('[data-key]');if(k2){screenKey(k2.getAttribute('data-key'));return;}
 var h=e.target.closest('[data-hit]');if(h){simHit(h.getAttribute('data-hit'));}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&S.view!=='menu'){go('menu');return;}
 if(isSim())physKey(e);
});
window.addEventListener('resize',layout);
function persist(){save(true);}
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')persist();});

function confetti(){
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 var box=$('confetti'),cols=['#F5A20F','#2F6FDF','#1E9E5A','#8A4FD8','#b3261e','#141414'];
 for(var i=0;i<70;i++){var p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*0.6)+'s';p.style.animationDuration=(1.8+Math.random()*1.2)+'s';box.appendChild(p);}
 setTimeout(function(){box.innerHTML='';},3800);
}

load();
render();
})();
</script>
</body>
